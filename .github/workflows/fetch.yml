name: Fetch MoonBazaar Leaderboard

on:
  schedule:
    # 每小时整点运行
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pynacl

      - name: Run fetch script
        env:
          MOON_COOKIE: ${{ secrets.MOON_COOKIE }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python fetch_rank.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add leaderboard.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update leaderboard $(date +'%Y-%m-%d %H:%M')"
          git push

      - name: Trigger Cloudflare Deploy
        run: curl -X POST "${{ secrets.CF_DEPLOY_HOOK }}"
